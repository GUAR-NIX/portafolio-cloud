name: modern-data-stack-dagster-dbt

on:
  push:
    paths: ["modern-data-stack-dagster-dbt/**", ".github/workflows/modern-data-stack-dagster-dbt.yml"]
  pull_request:
    paths: ["modern-data-stack-dagster-dbt/**", ".github/workflows/modern-data-stack-dagster-dbt.yml"]
defaults:
  run:
    working-directory: modern-data-stack-dagster-dbt

jobs:
  dbt-pytest-ruff:
    name: dbt build (muestra) + pytest + ruff
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ci
      UBICACION_CRUDO: ${{ github.workspace }}/modern-data-stack-dagster-dbt/data/muestra
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modern-data-stack-dagster-dbt/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests scripts descargar_datos.py
      - name: dbt build sobre la muestra versionada
        working-directory: modern-data-stack-dagster-dbt/dbt_clima
        run: dbt build --profiles-dir .
      - name: Pytest
        run: pytest -rs

  terraform:
    name: terraform fmt + validate (sin apply)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fmt y validate con la imagen oficial
        run: |
          docker run --rm -v "$PWD/terraform/gcp:/tf" -w /tf hashicorp/terraform:1.13 fmt -check -recursive
          docker run --rm -v "$PWD/terraform/gcp:/tf" -w /tf hashicorp/terraform:1.13 init -backend=false -input=false
          docker run --rm -v "$PWD/terraform/gcp:/tf" -w /tf hashicorp/terraform:1.13 validate

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
