name: streaming-github-redpanda-spark

on:
  push:
    paths: ["streaming-github-redpanda-spark/**", ".github/workflows/streaming-github-redpanda-spark.yml"]
  pull_request:
    paths: ["streaming-github-redpanda-spark/**", ".github/workflows/streaming-github-redpanda-spark.yml"]
defaults:
  run:
    working-directory: streaming-github-redpanda-spark

jobs:
  pruebas:
    name: Ruff + pytest (Python 3.11, Java 17, PySpark 3.5.3 + Delta 3.2.1)
    runs-on: ubuntu-latest
    env:
      # Fuera de la imagen de Docker los conectores se bajan con Ivy al crear la sesión (solo Delta para las pruebas)
      SPARK_PAQUETES: io.delta:delta-spark_2.12:3.2.1
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: streaming-github-redpanda-spark/requirements-spark.txt
      - run: pip install -r requirements-spark.txt
      - name: Ruff
        run: ruff check src tests scripts dashboard
      - name: Pytest (Spark local en el runner, muestra real de GH Archive en data/muestra)
        run: pytest -q -rs

  compose:
    name: docker compose config + imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Construir la imagen del proyecto (conectores precargados)
        run: docker build -f docker/spark/Dockerfile -t streaming-gh:local .

  terraform:
    name: Terraform de referencia (fmt + validate, sin apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streaming-github-redpanda-spark/infra/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
