[project]
name = "lakehouse-iceberg"
version = "1.0.0"
description = "Lakehouse local con Apache Iceberg, Trino y Nessie sobre los pageviews de Wikipedia"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integracion: necesita el docker compose levantado"]
addopts = "-m 'not integracion'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
