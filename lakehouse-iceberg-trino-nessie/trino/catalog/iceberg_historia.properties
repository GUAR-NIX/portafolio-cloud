# Catálogo Iceberg REST servido por Nessie en la etiqueta `historia` (time travel por commit; solo lectura)
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/historia
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
# Permite expire_snapshots/remove_orphan_files con retención 0 para la demostración (en producción: >= 7d)
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
