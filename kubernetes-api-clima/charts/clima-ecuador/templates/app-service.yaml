apiVersion: v1
kind: Service
metadata:
  name: {{ include "clima.nombre" . }}-app
  labels:
    {{- include "clima.etiquetas" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ include "clima.nombre" . }}
    app.kubernetes.io/component: app
  ports:
    - {name: http, port: 8501, targetPort: http, nodePort: 30080}

