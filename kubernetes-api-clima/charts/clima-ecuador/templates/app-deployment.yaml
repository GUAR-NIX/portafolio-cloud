apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clima.nombre" . }}-app
  labels:
    {{- include "clima.etiquetas" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clima.nombre" . }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clima.nombre" . }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "clima.nombre" . }}-config}
          ports:
            - {name: http, containerPort: 8501}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}

