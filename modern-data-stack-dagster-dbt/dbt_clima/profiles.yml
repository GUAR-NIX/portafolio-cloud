# Perfiles de dbt-duckdb. Solo credenciales locales de MinIO (nunca una nube real).
clima:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('RUTA_DUCKDB', '/opt/almacen/clima.duckdb') }}"
      threads: 2
      extensions: [httpfs]
      settings:
        # el derrame a disco va a <archivo>.duckdb.tmp en el volumen almacen (valor por defecto de DuckDB)
        memory_limit: "{{ env_var('MEMORIA_DUCKDB_DBT', '3GB') }}"
        preserve_insertion_order: false
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY', 'minio_local') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY', 'minio_local_clave') }}"
        s3_url_style: path
        s3_use_ssl: false
        s3_region: us-east-1
    # CI y pruebas: muestra versionada en data/muestra, sin MinIO
    ci:
      type: duckdb
      path: "{{ env_var('RUTA_DUCKDB_CI', 'target/ci.duckdb') }}"
      threads: 2
